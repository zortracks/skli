name: Sync develop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open PR main → develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin develop main

          if ! git rev-parse --verify origin/develop >/dev/null 2>&1; then
            echo "origin/develop does not exist"
            exit 1
          fi

          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "develop already contains main — nothing to sync"
            exit 0
          fi

          EXISTING=$(gh pr list --base develop --head main --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open (main → develop)"
            exit 0
          fi

          gh pr create \
            --base develop \
            --head main \
            --title "Sync main → develop" \
            --body "Automatic sync after changes landed on \`main\`. Merge to bring release commits (and any other main-only fixes) back into \`develop\`."
