name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  pull-requests: write
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version, commit, and tag
        run: npm version "${{ inputs.bump }}" -m "chore: release v%s"

      - name: Push commit and tag
        run: git push origin main --follow-tags

      - run: npm ci
      - run: npm run build
      - name: Smoke CLI
        run: npx skli --help

      - name: Check package version matches tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Expected tag $TAG not found"
            exit 1
          fi
          echo "Publishing $TAG"

      - run: npm publish

      - name: Open PR main → develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin develop main

          if ! git rev-parse --verify origin/develop >/dev/null 2>&1; then
            echo "origin/develop does not exist"
            exit 1
          fi

          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "develop already contains main — nothing to sync"
            exit 0
          fi

          EXISTING=$(gh pr list --base develop --head main --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open (main → develop)"
            exit 0
          fi

          gh pr create \
            --base develop \
            --head main \
            --title "Sync main → develop" \
            --body "Automatic sync after release on \`main\`. Merge to bring the release commit back into \`develop\`."

  docs:
    needs: [release]
    if: |
      always() &&
      (needs.release.result == 'success' || needs.release.result == 'skipped') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run docs:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: [docs]
    if: needs.docs.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
